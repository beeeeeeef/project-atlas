<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%234a8fbf'/></svg>">
<title>Project Atlas · 架构图</title>
<style>/*__VIEWER_CSS__*/</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span id="project">project</span>
      <span id="geninfo"></span>
    </div>
    <nav id="levels" aria-label="层级"></nav>
    <div class="grow"></div>
    <div id="stats"></div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="搜索 模块 / 文件 / 函数 / 类型 …  /" autocomplete="off" spellcheck="false" aria-label="搜索节点">
      <div id="results" hidden></div>
    </div>
  </header>

  <div id="warnbar" hidden></div>

  <div id="body">
    <nav id="sidenav" aria-label="页面">
      <button class="tab" data-tab="overview"><span class="ti">◉</span><span>概览</span></button>
      <button class="tab" data-tab="arch"><span class="ti">▦</span><span>架构</span></button>
      <button class="tab" data-tab="flow"><span class="ti">⇉</span><span>流程</span></button>
      <button class="tab" data-tab="data"><span class="ti">⬡</span><span>数据</span></button>
      <div class="spacer"></div>
      <button id="backbtn" title="返回上一处（←）" disabled>← 返回</button>
    </nav>

    <section id="content">

      <article id="overview" hidden></article>

      <div id="stagewrap">
        <div id="viewhead">
          <nav id="crumbs" aria-label="面包屑"></nav>
          <h1 id="vtitle"></h1>
          <p id="vnote"></p>
        </div>

        <div id="flowpicker" hidden></div>

        <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="架构图">
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                    markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0.5 0.6 L9.4 5 L0.5 9.4 z" fill="#5b6f83"></path>
            </marker>
            <marker id="arw-inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                    markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0.5 0.6 L9.4 5 L0.5 9.4 z" fill="#a58a5e"></path>
            </marker>
            <marker id="arw-mix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                    markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0.5 0.6 L9.4 5 L0.5 9.4 z" fill="#6b8098"></path>
            </marker>
          </defs>
          <g id="cam">
            <g id="edges"></g>
            <g id="nodes"></g>
            <g id="elabels"></g>
          </g>
        </svg>

        <div id="legend"></div>
        <div id="hint">滚轮缩放 · 拖拽平移 · 双击复位 · / 搜索 · ← 返回 · Esc 关闭</div>
        <div id="toast" hidden></div>

        <aside id="panel" hidden aria-label="节点详情"></aside>
      </div>

      <section id="dataview" hidden></section>

    </section>
  </div>


</div>
<script>window.__ARCH__ = /*__ARCH_DATA__*/;</script>
<script>/*__VIEWER_JS__*/</script>
</body>
</html>
